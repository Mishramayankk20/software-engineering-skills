server.port=8082

spring.application.name=order-service

# ---- Consul discovery ----
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.service-name=${spring.application.name}
spring.cloud.consul.discovery.instance-id=${spring.application.name}-${server.port}
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=15s
spring.cloud.consul.discovery.health-check-critical-timeout=30s

# ---- Datasource (local MySQL) ----
# createDatabaseIfNotExist=true auto-creates "orderdb" on first connection
spring.datasource.url=jdbc:mysql://localhost:3306/orderdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---- Feign / OpenFeign settings ----
feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=basic
feign.circuitbreaker.enabled=true

# ---- Resilience4j circuit breaker (cartService) ----
resilience4j.circuitbreaker.instances.cartService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.cartService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.cartService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.cartService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.cartService.permittedNumberOfCallsInHalfOpenState=3

# ---- Resilience4j time limiter (cartService) ----
resilience4j.timelimiter.instances.cartService.timeoutDuration=5s

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always

# ---- Logging ----
logging.level.com.example.orderservice=DEBUG
logging.level.com.example.orderservice.client=DEBUG